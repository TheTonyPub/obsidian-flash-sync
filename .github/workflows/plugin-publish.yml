name: Plugin publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Destination candidate or stable tag
        required: true
        type: string
      source_tag:
        description: Exact alpha, beta, or rc tag of the tested artifact
        required: true
        type: string
      build_run_id:
        description: Successful CI tag build run ID
        required: true
        type: string
      build_run_attempt:
        description: Exact successful build attempt
        required: true
        type: string
      artifact_id:
        description: Installation artifact ID from that attempt
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: plugin-publication-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify and publish existing installation files
        env:
          GH_TOKEN: ${{ github.token }}
          DESTINATION_TAG: ${{ inputs.tag }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          node scripts/plugin-publish.mjs --tag "$DESTINATION_TAG" --source-tag "$SOURCE_TAG" --build-run-id "$BUILD_RUN_ID" --build-run-attempt "$BUILD_RUN_ATTEMPT" --artifact-id "$ARTIFACT_ID" --repo . --directory "$RUNNER_TEMP/plugin-publication"
      - name: Record publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-publication/publication-info.json
          if-no-files-found: ignore
          retention-days: 90
