name: CI
on:
  push:
    branches:
      - dev
      - master
      - "release/*"
    tags:
      - "**"
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.validate.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: validate tag
        id: validate
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node scripts/plugin-release.mjs validate --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repo . --github-output "$GITHUB_OUTPUT"
          else
            echo "channel=branch" >> "$GITHUB_OUTPUT"
          fi
      - name: Stable promotion instructions
        if: steps.validate.outputs.channel == 'stable'
        run: echo "Stable tags do not compile or publish. Dispatch Plugin publication with the verified candidate run, attempt, and artifact ID." >> "$GITHUB_STEP_SUMMARY"
  checks:
    needs: validate
    if: needs.validate.outputs.channel != 'stable'
    runs-on: ubuntu-latest
    env:
      PUBLISH_COVERAGE_BADGE: ${{ secrets.GIST_ID != '' && secrets.GIST_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: build plugin
        run: npm run build:plugin
      - name: unit coverage
        run: npm run test:coverage
      - name: Record badge publish start
        if: ${{ env.PUBLISH_COVERAGE_BADGE == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') }}
        run: echo "BADGE_PUBLISH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Publish unit test coverage badge
        if: ${{ env.PUBLISH_COVERAGE_BADGE == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') }}
        uses: gaelgirodon/ci-badges-action@v1
        with:
          gist-id: ${{ secrets.GIST_ID }}
          token: ${{ secrets.GIST_TOKEN }}
          ref: true
      - name: Verify coverage badge was published
        if: ${{ env.PUBLISH_COVERAGE_BADGE == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') }}
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          updated_at=$(gh api "/gists/$GIST_ID" --jq .updated_at)
          if [[ "$updated_at" < "$BADGE_PUBLISH_STARTED_AT" ]]; then
            echo "Coverage badge Gist was not updated by this run" >&2
            exit 1
          fi
      - name: Prepare disposable NATS server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/nats-server.tar.gz"
          echo "5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92  $RUNNER_TEMP/nats-server.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nats-server.tar.gz" -C "$RUNNER_TEMP"
          echo "NATS_SERVER_BIN=$RUNNER_TEMP/nats-server-v2.15.0-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - name: CLI bundle tests
        run: npm run test:server-cli-bundle
      - name: integration tests
        run: npm run test:integration
      - name: NATS recovery tests
        run: NATS_TEST_DOCKER=1 npx vitest run tests/integration/recovery-nats.test.ts
      - name: S3 blob tests
        run: S3_TEST_DOCKER=1 npx vitest run tests/integration/blob-minio.test.ts
      - name: simulation tests
        run: npm run test:simulation
      - name: aggregate coverage
        run: npm run test:coverage:aggregate
        env:
          NATS_TEST_DOCKER: "1"
          S3_TEST_DOCKER: "1"
      - name: Upload aggregate coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aggregate-coverage-${{ github.run_id }}
          path: coverage/aggregate/lcov.info
          if-no-files-found: warn
      - name: package installation artifact
        if: github.ref_type == 'tag'
        run: node scripts/plugin-release.mjs artifact --tag "$GITHUB_REF_NAME" --repo . --directory dist/plugin-artifact
      - name: upload installation artifact
        if: github.ref_type == 'tag'
        id: installation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flash-sync-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/plugin-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Record installation artifact identity
        if: github.ref_type == 'tag'
        env:
          ARTIFACT_ID: ${{ steps.installation.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.installation.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.installation.outputs.artifact-url }}
        run: |
          printf 'Tag: %s\nRun: %s\nAttempt: %s\nArtifact: %s\nSHA-256 archive: %s\nDownload: %s\n' "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
