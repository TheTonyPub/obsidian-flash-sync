name: CI
on:
  push:
    branches:
      - dev
      - master
    tags:
      - "**"
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PUBLISH_COVERAGE_BADGE: ${{ secrets.GIST_ID != '' && secrets.GIST_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:plugin
      - run: npm run test:coverage
      - name: Record badge publish start
        if: ${{ env.PUBLISH_COVERAGE_BADGE == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') }}
        run: echo "BADGE_PUBLISH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Publish unit test coverage badge
        if: ${{ env.PUBLISH_COVERAGE_BADGE == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') }}
        uses: gaelgirodon/ci-badges-action@v1
        with:
          gist-id: ${{ secrets.GIST_ID }}
          token: ${{ secrets.GIST_TOKEN }}
          ref: true
      - name: Verify coverage badge was published
        if: ${{ env.PUBLISH_COVERAGE_BADGE == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') }}
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          updated_at=$(gh api "/gists/$GIST_ID" --jq .updated_at)
          if [[ "$updated_at" < "$BADGE_PUBLISH_STARTED_AT" ]]; then
            echo "Coverage badge Gist was not updated by this run" >&2
            exit 1
          fi
      - name: Prepare disposable NATS server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/nats-server.tar.gz"
          echo "5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92  $RUNNER_TEMP/nats-server.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nats-server.tar.gz" -C "$RUNNER_TEMP"
          echo "NATS_SERVER_BIN=$RUNNER_TEMP/nats-server-v2.15.0-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - run: npm run test:server-cli-bundle
      - run: npm run test:integration
      - run: NATS_TEST_DOCKER=1 npx vitest run tests/integration/recovery-nats.test.ts
      - run: S3_TEST_DOCKER=1 npx vitest run tests/integration/blob-minio.test.ts
      - run: npm run test:simulation
      - name: Aggregate unit, integration, and simulation coverage
        run: npm run test:coverage:aggregate
        env:
          NATS_TEST_DOCKER: "1"
          S3_TEST_DOCKER: "1"
      - name: Upload aggregate coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-coverage-${{ github.run_id }}
          path: coverage/aggregate/lcov.info
          if-no-files-found: warn
  plugin-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: validate
        id: validate
        run: node scripts/plugin-release.mjs validate --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repo . --github-output "$GITHUB_OUTPUT"
      - name: build
        run: |
          npm ci
          npm run build:plugin
          node scripts/plugin-release.mjs package --tag "$GITHUB_REF_NAME" --repo . --directory dist/plugin-release
      - name: test
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          node scripts/plugin-release.mjs verify --tag "$GITHUB_REF_NAME" --directory dist/plugin-release
      - name: release development artifact
        if: steps.validate.outputs.channel == 'development'
        uses: actions/upload-artifact@v4
        with:
          name: flash-sync-${{ github.ref_name }}
          path: dist/plugin-release/*
          if-no-files-found: error
      - name: release stable or prerelease
        if: steps.validate.outputs.channel != 'development'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.validate.outputs.channel }}
        run: |
          assets=(dist/plugin-release/main.js dist/plugin-release/manifest.json)
          if [ -f dist/plugin-release/styles.css ]; then assets+=(dist/plugin-release/styles.css); fi
          if [ "$RELEASE_CHANNEL" = "prerelease" ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "$GITHUB_REF_NAME" --notes "Flash Sync prerelease for manual installation." --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "$GITHUB_REF_NAME" --notes "Flash Sync stable release."
          fi
